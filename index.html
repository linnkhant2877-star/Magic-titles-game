// 🎼 PARSE PATTERN

function parsePattern(str) {
    const notes = [];
    const regex = /(?:(\d+(?:\+\d+)*))?<([\d.]+)>/g;
    let match;
    while ((match = regex.exec(str)) !== null) {
        const lanesStr = match[1] || '';
        const delay = parseFloat(match[2]) || 0;
        let lanes = [];
        if (lanesStr) {
            lanes = lanesStr.split('+').map(n => parseInt(n) - 1).filter(n => n >= 0 && n <= 3);
        }
        notes.push({ lanes: lanes, delay: delay });
    }
    return notes;
}

function buildSchedule(patternStr) {
    const notes = parsePattern(patternStr);
    const schedule = [];
    let t = 0;
    for (const n of notes) {
        schedule.push({ lanes: n.lanes, spawnTime: t });
        t += n.delay;
    }
    return { schedule: schedule, duration: t };
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPianoNote(lane) {
    if (!audioCtx) return;
    const freq = LANE_FREQS[lane];
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.7);

    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.value = freq * 2;
    gain2.gain.setValueAtTime(0, now);
    gain2.gain.linearRampToValueAtTime(0.12, now + 0.01);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(now); osc2.stop(now + 0.4);
}

function playMissSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.4);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.4);
}

    HIT_LINE_Y = PLAY_HEIGHT * HIT_LINE_RATIO;
    hitLine.style.top = HIT_LINE_Y + 'px';

    playArea.appendChild(note);
    setTimeout(() => note.remove(), 10000);
}

// ============================================================
// 🎹 TILES
// ============================================================
function spawnTile(lane) {
    const tile = document.createElement('div');
    tile.className = 'tile ' + (Math.random() < 0.25 ? 'long' : 'short');
    tile.style.width = (LANE_WIDTH - 4) + 'px';
    tile.style.height = TILE_HEIGHT + 'px';
    tile.style.left = (lane * LANE_WIDTH + 2) + 'px';
    tile.style.top = (-TILE_HEIGHT - 10) + 'px';
    tile.dataset.lane = lane;
    tile.dataset.hit = '0';

    const onHit = (e) => {
        if (e.cancelable) e.preventDefault();
        hitTile(tile);
    };
    tile.addEventListener('touchstart', onHit, { passive: false });
    tile.addEventListener('mousedown', onHit);

    playArea.appendChild(tile);
    tiles.push(tile);
}

function hitTile(tile) {
    if (!isRunning || tile.dataset.hit === '1') return;
    tile.dataset.hit = '1';

    const lane = parseInt(tile.dataset.lane);
    playPianoNote(lane);

    tile.classList.add('hit');

    const tileRect = tile.getBoundingClientRect();
    const playRect = playArea.getBoundingClientRect();
    const x = tileRect.left - playRect.left + tileRect.width / 2;
    const y = tileRect.top - playRect.top + tileRect.height / 2;

    showJudgement('perfect', x, y, 'perfect');
    spawnSparkles(x, y);

    score++;
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    scoreEl.textContent = score;

    if (combo >= 3) {
        comboBox.classList.add('show');
        comboNum.textContent = combo;
    }
    if (combo >= 10) {
        comboFire.classList.add('show');
    }

    setTimeout(() => tile.remove(), 150);
    tiles = tiles.filter(t => t !== tile);
}

function missTile(tile) {
    if (tile.dataset.hit === '1') return;
    tile.dataset.hit = '1';

    playMissSound();
    combo = 0;
    comboBox.classList.remove('show');
    comboFire.classList.remove('show');

    const tileRect = tile.getBoundingClientRect();
    const playRect = playArea.getBoundingClientRect();
    const x = tileRect.left - playRect.left + tileRect.width / 2;
    const y = tileRect.top - playRect.top;

    showJudgement('MISS', x, y, 'miss');

    heartBox.classList.add('lost');
    heartBox.textContent = '💔';

    tile.remove();
    tiles = tiles.filter(t => t !== tile);

    setTimeout(() => gameOver(false), 500);
}

// ============================================================
// 🔁 GAME LOOP (Endless: A → B → A → B → ...)
// ============================================================
function gameLoop(timestamp) {
    if (!isRunning) return;

    if (!lastFrameTime) lastFrameTime = timestamp;
    const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.1);
    lastFrameTime = timestamp;

    // လက်ရှိ pattern ကို ရွေး (A, B, A, B, ...)
    const currentSchedule = PATTERN_LIST[loopCycle % PATTERN_LIST.length];
    const schedule = currentSchedule.schedule;
    const currentDuration = currentSchedule.duration;

    const elapsed = (Date.now() - gameStartTime) / 1000;
    const timeInPattern = elapsed - patternOffset;

    // Spawn scheduled tiles
    while (patternIndex < schedule.length && schedule[patternIndex].spawnTime <= timeInPattern) {
        const lanes = schedule[patternIndex].lanes;
        lanes.forEach(lane => spawnTile(lane));
        patternIndex++;
    }

    // Move tiles
    for (let i = tiles.length - 1; i >= 0; i--) {
        const tile = tiles[i];
        const currentTop = parseFloat(tile.style.top) || 0;
        const newTop = currentTop + FALL_SPEED * dt;
        tile.style.top = newTop + 'px';

        if (newTop >= HIT_LINE_Y && tile.dataset.hit === '0') {
            missTile(tile);
            return;
        }
    }

    // Pattern ပြီးရင် နောက်တစ်ခု ဆက်သွား
    if (patternIndex >= schedule.length && tiles.length === 0 && timeInPattern >= currentDuration) {
        patternOffset += currentDuration;
        patternIndex = 0;
        loopCycle++;
        console.log('🔁 Loop ' + loopCycle + ' | Pattern: ' + (loopCycle % 2 === 0 ? 'A' : 'B') + ' | Score: ' + score);
    }

    animFrameId = requestAnimationFrame(gameLoop);
}

// ============================================================
// 🚀 START / END
// ============================================================
function startGame() {
    initAudio();
    computeLayout();
    drawLaneDividers();

    // Reset
    tiles.forEach(t => t.remove());
    tiles = [];
    document.querySelectorAll('.floatNote, .judgement, .sparkle').forEach(e => e.remove());

    score = 0;
    combo = 0;
    maxCombo = 0;
    patternIndex = 0;
    patternOffset = 0;
    loopCycle = 0;
    lastFrameTime = 0;

    scoreEl.textContent = '0';
    comboNum.textContent = '0';
    comboBox.classList.remove('show');
    comboFire.classList.remove('show');
    heartBox.classList.remove('lost');
    heartBox.textContent = '💖';

    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');

    if (bgMusic) {
        bgMusic.currentTime = 0;
        bgMusic.volume = 0.4;
        bgMusic.play().catch(e => console.log('Music file not found or blocked'));
    }

    isRunning = true;
    gameStartTime = Date.now();
    animFrameId = requestAnimationFrame(gameLoop);

    // Floating notes
    floatNoteTimer = setInterval(spawnFloatNote, 800);
}

function gameOver(won) {
    if (!isRunning) return;
    isRunning = false;

    if (animFrameId) cancelAnimationFrame(animFrameId);
    if (floatNoteTimer) clearInterval(floatNoteTimer);

    if (bgMusic) bgMusic.pause();

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('customPatternHigh', highScore);
        newRecordEl.style.display = 'block';
    } else {
        newRecordEl.style.display = 'none';
    }

    finalScoreEl.textContent = score;
    bestScoreEl.textContent = 'Best: ' + highScore;

    setTimeout(() => {
        gameOverOverlay.classList.remove('hidden');
    }, 400);

    if (window.Telegram && window.Telegram.WebApp) {
        try { window.Telegram.WebApp.sendData(score.toString()); } catch (e) {}
    }
}

// ============================================================
// 🎯 EVENTS
// ============================================================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

computeLayout();
window.addEventListener('resize', computeLayout);
</script>
